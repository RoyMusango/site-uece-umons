# Configuration de l'administration (Decap CMS) — Site UECE UMONS
#
# Ce fichier décrit :
#   1. backend : comment le CMS se connecte au dépôt GitHub (via DecapBridge,
#      qui permet aux membres du comité d'éditer avec un simple email,
#      sans compte GitHub).
#   2. collections : quels contenus sont éditables (data/gala.json).
#
# ⚠️ MISE EN SERVICE (une seule fois) : créer un compte sur
# https://decapbridge.com, y déclarer ce site (repo RoyMusango/site-uece-umons),
# puis REMPLACER le bloc « backend » ci-dessous par celui que DecapBridge
# génère pour vous. Procédure détaillée : README, section « CMS ».

backend:
  name: git-gateway
  repo: RoyMusango/site-uece-umons
  branch: main
  # ⬇️ Ces deux lignes sont fournies par DecapBridge à la création du site.
  identity_url: https://auth.decapbridge.com/sites/REMPLACER_PAR_L_ID_DU_SITE
  gateway_url: https://gateway.decapbridge.com

site_url: https://uece-umons.netlify.app
display_url: https://uece-umons.netlify.app
logo_url: https://uece-umons.netlify.app/images/logo-nav.png

media_folder: images/uploads
public_folder: images/uploads

collections:
  - name: gala
    label: "Page Gala"
    description: >-
      Contenus de la page de vente du Gala (gala.html). Les PRIX des billets
      ne sont volontairement PAS éditables ici : ils sont liés au code de
      paiement. Pour changer un prix, suivre le README, section
      « Changer les prix des billets ».
    files:
      - name: contenus
        label: "Gala — contenus de la page"
        file: data/gala.json
        fields:
          - label: "En-tête de la page"
            name: hero
            widget: object
            fields:
              - { label: "Sur-titre", name: eyebrow, widget: string }
              - { label: "Titre principal", name: titre, widget: string }
              - { label: "Sous-titre", name: sousTitre, widget: string }

          - label: "Texte d'introduction"
            name: intro
            widget: object
            fields:
              - { label: "Titre de section", name: titre, widget: string }
              - { label: "Phrase d'accroche", name: accroche, widget: text }
              - { label: "Paragraphe de présentation", name: paragraphe, widget: text }
              - { label: "Phrase d'annonce du programme", name: annonceProgramme, widget: string }
              - { label: "Note sous le programme", name: note, widget: string, hint: "Exemple : photographe, mention « horaires à confirmer »…" }

          - label: "Programme de la soirée"
            name: programme
            widget: list
            summary: "{{fields.heure}} · {{fields.titre}}"
            hint: "L'ordre d'affichage sur le site est l'ordre de cette liste."
            fields:
              - { label: "Heure", name: heure, widget: string }
              - { label: "Titre (en gras)", name: titre, widget: string }
              - { label: "Détail (suite de la phrase)", name: detail, widget: string, required: false }

          - label: "Encadré « En bref »"
            name: enBref
            widget: object
            fields:
              - { label: "Date", name: date, widget: string, hint: "⚠️ Après un changement de date ou de lieu, pensez à faire mettre à jour AUSSI le billet PDF et le mail automatique — voir README, « Changer la date ou le lieu »." }
              - { label: "Heures", name: heure, widget: string }
              - { label: "Lieu", name: lieu, widget: text, hint: "Une ligne d'adresse par ligne de texte." }
              - { label: "Dress code", name: dressCode, widget: string }
              - { label: "Dress code — précision", name: dressCodeDetail, widget: string }
              - { label: "Note en bas d'encadré", name: notePortes, widget: string }

          - label: "Informations importantes (3 blocs)"
            name: infos
            widget: object
            fields:
              - label: "Bloc 1 (icône billet)"
                name: bloc1
                widget: object
                fields:
                  - { label: "Titre", name: titre, widget: string }
                  - { label: "Texte", name: texte, widget: text, hint: "Une idée par ligne." }
              - label: "Bloc 2 (icône couverts)"
                name: bloc2
                widget: object
                fields:
                  - { label: "Titre", name: titre, widget: string }
                  - { label: "Texte", name: texte, widget: text, hint: "Une idée par ligne." }
              - label: "Bloc 3 (icône voiture)"
                name: bloc3
                widget: object
                fields:
                  - { label: "Titre", name: titre, widget: string }
                  - { label: "Texte", name: texte, widget: text, hint: "Une idée par ligne." }

          - label: "Billets — textes (les prix ne sont PAS modifiables ici)"
            name: billets
            widget: object
            fields:
              - { label: "Nom du billet Standard", name: standardNom, widget: string }
              - { label: "Description du billet Standard", name: standardDescription, widget: string }
              - { label: "Nom du billet VIP", name: vipNom, widget: string }
              - { label: "Description du billet VIP", name: vipDescription, widget: string }

          - label: "Questions fréquentes (FAQ)"
            name: faq
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: question, widget: string }
              - { label: "Réponse", name: reponse, widget: text }

  - name: faq
    label: "Page FAQ"
    description: "Questions/réponses générales de la page FAQ (faq.html)."
    files:
      - name: contenus
        label: "FAQ — questions et réponses"
        file: data/faq.json
        fields:
          - label: "En-tête de la page"
            name: entete
            widget: object
            fields:
              - { label: "Sur-titre", name: eyebrow, widget: string }
              - { label: "Titre", name: titre, widget: string }
              - { label: "Sous-titre", name: sousTitre, widget: text }
          - label: "Questions"
            name: questions
            widget: list
            summary: "{{fields.question}}"
            hint: "L'ordre d'affichage sur le site est l'ordre de cette liste."
            fields:
              - { label: "Question", name: question, widget: string }
              - { label: "Réponse", name: reponse, widget: text }

  - name: evenements
    label: "Page Événements"
    description: "Les rendez-vous affichés sur evenements.html (accordéon dépliable)."
    files:
      - name: contenus
        label: "Événements — liste des rendez-vous"
        file: data/evenements.json
        fields:
          - label: "En-tête de la page"
            name: entete
            widget: object
            fields:
              - { label: "Sur-titre", name: eyebrow, widget: string }
              - { label: "Titre", name: titre, widget: string }
              - { label: "Sous-titre", name: sousTitre, widget: text }
          - label: "Événements"
            name: evenements
            widget: list
            summary: "{{fields.titre}} — {{fields.jour}}"
            hint: "Le premier de la liste s'affiche déplié. Mettez le prochain événement en premier."
            fields:
              - { label: "Titre", name: titre, widget: string }
              - { label: "Jour", name: jour, widget: string, hint: "Ex. Samedi 15 mai 2026 — ou « Date à confirmer »." }
              - { label: "Heure", name: heure, widget: string, required: false }
              - { label: "Lieu", name: lieu, widget: string, required: false }
              - { label: "Description", name: description, widget: text }
              - { label: "Lien du bouton (optionnel)", name: lienUrl, widget: string, required: false, hint: "Ex. gala.html, ou un lien d'inscription complet." }
              - { label: "Texte du bouton (optionnel)", name: lienTexte, widget: string, required: false, hint: "Ex. Réserver ma place. Vide = « Plus d'informations »." }

  - name: association
    label: "Page Association"
    description: "Conditions d'adhésion, bureau actuel et historique des bureaux (association.html)."
    files:
      - name: bureaux
        label: "Association — adhésion et bureaux"
        file: data/bureaux.json
        fields:
          - { label: "Texte d'introduction (historique)", name: intro, widget: text }

          - label: "Conditions d'adhésion"
            name: adhesion
            widget: object
            fields:
              - label: "Liste des conditions"
                name: conditions
                widget: list
                hint: "Une condition par ligne — affichées avec une coche dorée."
                field: { label: "Condition", name: condition, widget: string }

          - label: "Bureau actuel"
            name: bureauActuel
            widget: object
            fields:
              - { label: "Période (ex. 2025 – 2026)", name: periode, widget: string }
              - label: "Membres"
                name: membres
                widget: list
                summary: "{{fields.role}} — {{fields.nom}}"
                fields:
                  - { label: "Rôle (ex. Présidence)", name: role, widget: string }
                  - { label: "Nom", name: nom, widget: string }
                  - { label: "Photo (optionnelle)", name: photo, widget: image, required: false, hint: "Portrait carré de préférence — il s'affiche en rond." }
                  - { label: "Mini-bio (optionnelle)", name: description, widget: text, required: false, hint: "Ex. Étudiant en master 1 en sciences économiques, passionné de gestion." }

          - label: "Bureaux précédents (historique)"
            name: bureaux
            widget: list
            summary: "{{fields.periode}}"
            hint: "Mettez le bureau le plus récent en premier."
            fields:
              - { label: "Période (ex. 2024 – 2025)", name: periode, widget: string }
              - { label: "Nom d'équipe (optionnel)", name: nom, widget: string, required: false }
              - label: "Membres"
                name: membres
                widget: list
                summary: "{{fields.role}} — {{fields.nom}}"
                fields:
                  - { label: "Rôle (ex. Présidence)", name: role, widget: string }
                  - { label: "Nom", name: nom, widget: string }
                  - { label: "Photo (optionnelle)", name: photo, widget: image, required: false, hint: "Portrait carré de préférence — il s'affiche en rond." }
                  - { label: "Mini-bio (optionnelle)", name: description, widget: text, required: false, hint: "Ex. Étudiante en bachelier en droit, passionnée de théâtre." }
