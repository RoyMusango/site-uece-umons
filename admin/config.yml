# Configuration de l'administration (Decap CMS) — Site UECE UMONS
#
# Ce fichier décrit :
#   1. backend : comment le CMS se connecte au dépôt GitHub (via DecapBridge,
#      qui permet aux membres du comité d'éditer avec un simple email,
#      sans compte GitHub).
#   2. collections : quels contenus sont éditables (data/gala.json).
#
# ⚠️ MISE EN SERVICE (une seule fois) : créer un compte sur
# https://decapbridge.com, y déclarer ce site (repo RoyMusango/site-uece-umons),
# puis REMPLACER le bloc « backend » ci-dessous par celui que DecapBridge
# génère pour vous. Procédure détaillée : README, section « CMS ».

backend:
  name: git-gateway
  repo: RoyMusango/site-uece-umons
  branch: main
  # ⬇️ Ces deux lignes sont fournies par DecapBridge à la création du site.
  identity_url: https://auth.decapbridge.com/sites/REMPLACER_PAR_L_ID_DU_SITE
  gateway_url: https://gateway.decapbridge.com

site_url: https://uece-umons.netlify.app
display_url: https://uece-umons.netlify.app
logo_url: https://uece-umons.netlify.app/images/logo-nav.png

media_folder: images/uploads
public_folder: images/uploads

collections:
  - name: global
    label: "Général (pied de page)"
    description: >-
      Contenu présent sur TOUTES les pages : le pied de page (contact, réseaux
      sociaux, copyright). Une modification ici se répercute sur les 8 pages.
    files:
      - name: pied
        label: "Pied de page (toutes les pages)"
        file: data/global.json
        fields:
          - label: "Colonne « Nous contacter »"
            name: contact
            widget: object
            fields:
              - { label: "Titre de la colonne", name: titre, widget: string }
              - { label: "Adresse", name: adresse, widget: string }
              - { label: "E-mail", name: email, widget: string }
              - { label: "Téléphone", name: telephone, widget: string }
          - label: "Colonne « Suivez-nous » (réseaux sociaux)"
            name: reseaux
            widget: object
            fields:
              - { label: "Titre de la colonne", name: titre, widget: string }
              - { label: "Lien Facebook", name: facebook, widget: string, hint: "Adresse complète (https://…)." }
              - { label: "Lien Instagram", name: instagram, widget: string, hint: "Adresse complète (https://…)." }
              - { label: "Lien TikTok", name: tiktok, widget: string, hint: "Adresse complète (https://…)." }
          - label: "Colonne « Informations »"
            name: informations
            widget: object
            fields:
              - { label: "Titre de la colonne", name: titre, widget: string, hint: "Les liens de cette colonne (mentions légales, etc.) restent fixes pour l'instant." }
          - { label: "Ligne de copyright (bas de page)", name: copyright, widget: string }

  - name: accueil
    label: "Page d'accueil"
    description: "Textes de la page d'accueil (index.html) : en-tête, panneau « Découvrir l'UECE », carte de bienvenue et encart du prochain événement."
    files:
      - name: contenus
        label: "Accueil — textes de la page"
        file: data/accueil.json
        fields:
          - label: "En-tête (hero)"
            name: hero
            widget: object
            fields:
              - { label: "Sur-titre", name: eyebrow, widget: string }
              - { label: "Titre principal", name: titre, widget: string }
              - { label: "Sous-titre", name: sousTitre, widget: string }

          - label: "Panneau « Découvrir l'UECE »"
            name: decouvrir
            widget: object
            fields:
              - { label: "Texte du bouton", name: bouton, widget: string }
              - label: "Entrées du panneau"
                name: entrees
                widget: list
                summary: "{{fields.titre}}"
                hint: "⚠️ Gardez EXACTEMENT 4 entrées (n'en ajoutez pas et n'en retirez pas) : la page en attend 4. Seuls les textes se modifient ici ; les liens sont fixes."
                fields:
                  - { label: "Titre de l'entrée", name: titre, widget: string }
                  - { label: "Description", name: description, widget: string }
              - { label: "Texte du bouton « Plus d'informations »", name: boutonAction, widget: string }

          - label: "Carrousel de la page d'accueil"
            name: affiches
            widget: list
            summary: "{{fields.legende}}"
            hint: "Ajoutez, modifiez, réordonnez (glisser-déposer) ou supprimez les diapositives à volonté — idéal pour mettre en avant un événement selon le moment de l'année. L'ordre d'affichage est celui de la liste."
            fields:
              - { label: "Image", name: image, widget: image, hint: "L'image entière est affichée (jamais recadrée), posée sur elle-même floutée en fond. Paysage ou portrait au choix. Conseil : largeur max ~1600 px pour garder la page légère." }
              - { label: "Texte alternatif (accessibilité)", name: alt, widget: string, required: false, hint: "Décrit l'image pour les personnes malvoyantes et les moteurs de recherche. Ex. « Affiche du Gala 2026 »." }
              - { label: "Légende (titre de la diapositive)", name: legende, widget: string, required: false, hint: "S'affiche sous l'image et sert de repère sur les puces." }

          - label: "Carte « Bienvenue à Mons »"
            name: bienvenue
            widget: object
            fields:
              - { label: "Titre", name: titre, widget: string }
              - { label: "Phrase d'accroche (en gras)", name: lead, widget: text }
              - { label: "Paragraphe 1", name: paragraphe1, widget: text }
              - { label: "Paragraphe 2", name: paragraphe2, widget: text }
              - { label: "Mention en bas de carte", name: note, widget: string }

          - label: "Carte « Prochain événement »"
            name: prochainEvenement
            widget: object
            fields:
              - { label: "Titre de la carte", name: titre, widget: string }
              - { label: "Nom de l'événement", name: nom, widget: string }
              - { label: "Date", name: date, widget: string }
              - { label: "Description", name: description, widget: text }
              - { label: "Texte du bouton", name: bouton, widget: string }
              - { label: "Mention sous le bouton", name: note, widget: string }

  - name: gala
    label: "Page Gala"
    description: >-
      Contenus de la page de vente du Gala (gala.html). Les PRIX des billets
      ne sont volontairement PAS éditables ici : ils sont liés au code de
      paiement. Pour changer un prix, suivre le README, section
      « Changer les prix des billets ».
    files:
      - name: contenus
        label: "Gala — contenus de la page"
        file: data/gala.json
        fields:
          - label: "En-tête de la page"
            name: hero
            widget: object
            fields:
              - { label: "Sur-titre", name: eyebrow, widget: string }
              - { label: "Titre principal", name: titre, widget: string }
              - { label: "Sous-titre", name: sousTitre, widget: string }

          - label: "Texte d'introduction"
            name: intro
            widget: object
            fields:
              - { label: "Titre de section", name: titre, widget: string }
              - { label: "Phrase d'accroche", name: accroche, widget: text }
              - { label: "Paragraphe de présentation", name: paragraphe, widget: text }
              - { label: "Phrase d'annonce du programme", name: annonceProgramme, widget: string }
              - { label: "Note sous le programme", name: note, widget: string, hint: "Exemple : photographe, mention « horaires à confirmer »…" }

          - label: "Programme de la soirée"
            name: programme
            widget: list
            summary: "{{fields.heure}} · {{fields.titre}}"
            hint: "L'ordre d'affichage sur le site est l'ordre de cette liste."
            fields:
              - { label: "Heure", name: heure, widget: string }
              - { label: "Titre (en gras)", name: titre, widget: string }
              - { label: "Détail (suite de la phrase)", name: detail, widget: string, required: false }

          - label: "Encadré « En bref »"
            name: enBref
            widget: object
            fields:
              - { label: "Date", name: date, widget: string, hint: "⚠️ Après un changement de date ou de lieu, pensez à faire mettre à jour AUSSI le billet PDF et le mail automatique — voir README, « Changer la date ou le lieu »." }
              - { label: "Heures", name: heure, widget: string }
              - { label: "Lieu", name: lieu, widget: text, hint: "Une ligne d'adresse par ligne de texte." }
              - { label: "Dress code", name: dressCode, widget: string }
              - { label: "Dress code — précision", name: dressCodeDetail, widget: string }
              - { label: "Note en bas d'encadré", name: notePortes, widget: string }

          - label: "Informations importantes (3 blocs)"
            name: infos
            widget: object
            fields:
              - label: "Bloc 1 (icône billet)"
                name: bloc1
                widget: object
                fields:
                  - { label: "Titre", name: titre, widget: string }
                  - { label: "Texte", name: texte, widget: text, hint: "Une idée par ligne." }
              - label: "Bloc 2 (icône couverts)"
                name: bloc2
                widget: object
                fields:
                  - { label: "Titre", name: titre, widget: string }
                  - { label: "Texte", name: texte, widget: text, hint: "Une idée par ligne." }
              - label: "Bloc 3 (icône voiture)"
                name: bloc3
                widget: object
                fields:
                  - { label: "Titre", name: titre, widget: string }
                  - { label: "Texte", name: texte, widget: text, hint: "Une idée par ligne." }

          - label: "Billets — textes (les prix ne sont PAS modifiables ici)"
            name: billets
            widget: object
            fields:
              - { label: "Nom du billet Standard", name: standardNom, widget: string }
              - { label: "Description du billet Standard", name: standardDescription, widget: string }
              - { label: "Nom du billet VIP", name: vipNom, widget: string }
              - { label: "Description du billet VIP", name: vipDescription, widget: string }

          - label: "Questions fréquentes (FAQ)"
            name: faq
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: question, widget: string }
              - { label: "Réponse", name: reponse, widget: text }

  - name: faq
    label: "Page FAQ"
    description: "Questions/réponses générales de la page FAQ (faq.html)."
    files:
      - name: contenus
        label: "FAQ — questions et réponses"
        file: data/faq.json
        fields:
          - label: "En-tête de la page"
            name: entete
            widget: object
            fields:
              - { label: "Sur-titre", name: eyebrow, widget: string }
              - { label: "Titre", name: titre, widget: string }
              - { label: "Sous-titre", name: sousTitre, widget: text }
          - label: "Questions"
            name: questions
            widget: list
            summary: "{{fields.question}}"
            hint: "L'ordre d'affichage sur le site est l'ordre de cette liste."
            fields:
              - { label: "Question", name: question, widget: string }
              - { label: "Réponse", name: reponse, widget: text }

  - name: evenements
    label: "Page Événements"
    description: "Les rendez-vous affichés sur evenements.html (accordéon dépliable)."
    files:
      - name: contenus
        label: "Événements — liste des rendez-vous"
        file: data/evenements.json
        fields:
          - label: "En-tête de la page"
            name: entete
            widget: object
            fields:
              - { label: "Sur-titre", name: eyebrow, widget: string }
              - { label: "Titre", name: titre, widget: string }
              - { label: "Sous-titre", name: sousTitre, widget: text }
          - label: "Événements"
            name: evenements
            widget: list
            summary: "{{fields.titre}} — {{fields.jour}}"
            hint: "Le premier de la liste s'affiche déplié. Mettez le prochain événement en premier."
            fields:
              - { label: "Titre", name: titre, widget: string }
              - { label: "Jour", name: jour, widget: string, hint: "Ex. Samedi 15 mai 2026 — ou « Date à confirmer »." }
              - { label: "Heure", name: heure, widget: string, required: false }
              - { label: "Lieu", name: lieu, widget: string, required: false }
              - { label: "Description", name: description, widget: text }
              - { label: "Lien du bouton (optionnel)", name: lienUrl, widget: string, required: false, hint: "Ex. gala.html, ou un lien d'inscription complet." }
              - { label: "Texte du bouton (optionnel)", name: lienTexte, widget: string, required: false, hint: "Ex. Réserver ma place. Vide = « Plus d'informations »." }

  - name: annonces
    label: "Page Infos (HUE / UE)"
    description: >-
      Annonces et démarches administratives (annonces.html). ⚠️ Les montants et
      délais changent chaque année académique : à revalider à chaque rentrée.
    files:
      - name: contenus
        label: "Infos — annonces et démarches"
        file: data/annonces.json
        fields:
          - label: "En-tête de la page"
            name: entete
            widget: object
            fields:
              - { label: "Sur-titre", name: eyebrow, widget: string }
              - { label: "Titre", name: titre, widget: string }
              - { label: "Sous-titre", name: lead, widget: text, hint: "Un retour à la ligne dans le texte devient un saut de ligne sur le site." }

          - label: "Annonces / démarches"
            name: annonces
            widget: list
            summary: "{{fields.public}} — {{fields.titre}}"
            hint: "L'ordre d'affichage sur le site est l'ordre de cette liste."
            fields:
              - { label: "Public concerné", name: public, widget: select, options: ["HUE", "UE", "Tous"], hint: "HUE = hors Union européenne · UE = Union européenne (non belge) · Tous = tous les étudiants internationaux. Détermine la couleur du badge." }
              - { label: "Délai / échéance", name: deadline, widget: string, hint: "Ex. « Dans les 3 mois suivant l'arrivée »." }
              - { label: "Titre de l'annonce", name: titre, widget: string }
              - { label: "Description", name: description, widget: text }
              - { label: "Libellé de la source", name: sourceLabel, widget: string, hint: "Ex. « Ville de Mons — Service des Étrangers »." }
              - { label: "Lien de la source", name: sourceUrl, widget: string, hint: "Adresse complète commençant par https://" }
              - { label: "Date de publication", name: datePublication, widget: string, hint: "Ex. 01/07/2026. Affichée après « Publié le »." }
              - { label: "Note sur la source (optionnelle)", name: sourceNote, widget: string, required: false, hint: "Ex. « modalités à vérifier chaque année ». Affichée en italique." }

          - label: "Encadré « Besoin d'aide ? »"
            name: aide
            widget: object
            fields:
              - { label: "Sur-titre", name: eyebrow, widget: string }
              - { label: "Titre", name: titre, widget: string }
              - { label: "Texte", name: texte, widget: text }

          - { label: "Avertissement du bas de page", name: disclaimer, widget: text }

  - name: guide
    label: "Page Guide de l'étudiant"
    description: >-
      Textes du Guide de l'étudiant (guide.html) : culture, lieux clés, marchés.
      ℹ️ Trois paragraphes qui contiennent un lien ou du gras (cartes
      Administration, Musées, Sainte-Waudru) ne sont pas éditables ici — seul
      leur titre l'est. Modifier ces textes demande de retoucher le HTML.
    files:
      - name: contenus
        label: "Guide — textes de la page"
        file: data/guide.json
        fields:
          - label: "En-tête de la page"
            name: entete
            widget: object
            fields:
              - { label: "Sur-titre", name: eyebrow, widget: string }
              - { label: "Titre", name: titre, widget: string }
              - { label: "Sous-titre", name: lead, widget: text, hint: "Un retour à la ligne devient un saut de ligne sur le site." }

          - label: "Section « Culture »"
            name: culture
            widget: object
            fields:
              - { label: "Sur-titre de section", name: eyebrow, widget: string }
              - { label: "Titre de section", name: titre, widget: string }
              - label: "Carte vedette — Le Beffroi"
                name: beffroi
                widget: object
                fields:
                  - { label: "Sur-titre (ex. Classé UNESCO)", name: eyebrow, widget: string }
                  - { label: "Titre", name: titre, widget: string }
                  - { label: "Texte", name: texte, widget: text }
              - label: "Carte — Le Doudou"
                name: doudou
                widget: object
                fields:
                  - { label: "Titre", name: titre, widget: string }
                  - { label: "Texte", name: texte, widget: text }
              - label: "Carte — Sainte-Waudru (titre seul)"
                name: sainteWaudru
                widget: object
                fields:
                  - { label: "Titre", name: titre, widget: string, hint: "Le texte de cette carte n'est pas éditable ici (il contient un mot en italique)." }
              - label: "Carte — Musées (titre seul)"
                name: musees
                widget: object
                fields:
                  - { label: "Titre", name: titre, widget: string, hint: "Le texte de cette carte n'est pas éditable ici (il contient des mots en gras)." }
              - { label: "Galerie Doudou — Sur-titre", name: galerieEyebrow, widget: string }
              - { label: "Galerie Doudou — Titre", name: galerieTitre, widget: string }
              - label: "Galerie Doudou — Légendes des photos"
                name: galerieLegendes
                widget: list
                hint: "⚠️ Gardez EXACTEMENT 5 légendes (une par photo du carrousel)."
                field: { label: "Légende", name: legende, widget: string }

          - label: "Section « Lieux clés »"
            name: lieux
            widget: object
            fields:
              - { label: "Sur-titre de section", name: eyebrow, widget: string }
              - { label: "Titre de section", name: titre, widget: string }
              - label: "Carte — Administration (titre seul)"
                name: administration
                widget: object
                fields:
                  - { label: "Titre", name: titre, widget: string, hint: "Le texte de cette carte n'est pas éditable ici (il contient un lien vers la page Infos)." }
              - label: "Carte — Campus UMONS"
                name: campus
                widget: object
                fields:
                  - { label: "Titre", name: titre, widget: string }
                  - { label: "Texte", name: texte, widget: text }
              - label: "Carte — Se déplacer, respirer"
                name: deplacer
                widget: object
                fields:
                  - { label: "Titre", name: titre, widget: string }
                  - { label: "Texte", name: texte, widget: text }

          - label: "Section « Marchés »"
            name: marches
            widget: object
            fields:
              - { label: "Sur-titre de section", name: eyebrow, widget: string }
              - { label: "Titre de section", name: titre, widget: string }
              - label: "Légendes du carrousel des marchés"
                name: legendes
                widget: list
                hint: "⚠️ Gardez EXACTEMENT 3 légendes (une par photo)."
                field: { label: "Légende", name: legende, widget: string }
              - label: "Marchés de la semaine"
                name: liste
                widget: list
                summary: "{{fields.jour}} — {{fields.nom}}"
                hint: "L'ordre d'affichage est l'ordre de cette liste."
                fields:
                  - { label: "Jour (ex. Ven., Dim., Hebdo)", name: jour, widget: string }
                  - { label: "Nom du marché", name: nom, widget: string }
                  - { label: "Détail", name: detail, widget: string, required: false }
              - { label: "Note sous les marchés", name: note, widget: text }

          - label: "Bloc contact"
            name: contact
            widget: object
            fields:
              - { label: "Sur-titre", name: eyebrow, widget: string }
              - { label: "Titre", name: titre, widget: string }
              - { label: "Texte", name: texte, widget: text }

  - name: association
    label: "Page Association"
    description: "Toute la page « C'est quoi l'UECE ? » (association.html) : en-tête, mission, adhésion, bureau actuel et historique des bureaux."
    files:
      - name: bureaux
        label: "Association — page complète"
        file: data/bureaux.json
        fields:
          - label: "En-tête de la page"
            name: entete
            widget: object
            fields:
              - { label: "Sur-titre", name: eyebrow, widget: string }
              - { label: "Titre", name: titre, widget: string }
              - { label: "Sous-titre", name: lead, widget: text, hint: "Un retour à la ligne devient un saut de ligne sur le site." }

          - label: "Notre mission"
            name: mission
            widget: object
            fields:
              - { label: "Sur-titre", name: eyebrow, widget: string }
              - { label: "Titre", name: titre, widget: string }
              - label: "Les 3 cartes (Accueillir / Intégrer / Représenter)"
                name: cartes
                widget: list
                summary: "{{fields.titre}}"
                hint: "⚠️ Gardez EXACTEMENT 3 cartes (chacune a son image et son icône). Seuls les textes se modifient ici."
                fields:
                  - { label: "Titre de la carte", name: titre, widget: string }
                  - { label: "Texte", name: texte, widget: text }

          - { label: "Texte d'introduction (historique)", name: intro, widget: text }

          - label: "Encart « Devenir membre »"
            name: adhesion
            widget: object
            fields:
              - { label: "Sur-titre", name: eyebrow, widget: string }
              - { label: "Titre", name: titre, widget: string }
              - label: "Liste des conditions"
                name: conditions
                widget: list
                hint: "Une condition par ligne — affichées avec une coche dorée."
                field: { label: "Condition", name: condition, widget: string }
              - { label: "Phrase de contact (sous les conditions)", name: contact, widget: text }

          - label: "Bureau actuel"
            name: bureauActuel
            widget: object
            fields:
              - { label: "Sur-titre de section", name: eyebrow, widget: string }
              - { label: "Titre de section", name: titre, widget: string }
              - { label: "Période (ex. 2025 – 2026)", name: periode, widget: string }
              - label: "Membres"
                name: membres
                widget: list
                summary: "{{fields.role}} — {{fields.nom}}"
                fields:
                  - { label: "Rôle (ex. Présidence)", name: role, widget: string }
                  - { label: "Nom", name: nom, widget: string }
                  - { label: "Photo (optionnelle)", name: photo, widget: image, required: false, hint: "Portrait carré de préférence — il s'affiche en rond." }
                  - { label: "Mini-bio (optionnelle)", name: description, widget: text, required: false, hint: "Ex. Étudiant en master 1 en sciences économiques, passionné de gestion." }

          - label: "Section « Historique » (titres)"
            name: histoire
            widget: object
            fields:
              - { label: "Sur-titre", name: eyebrow, widget: string }
              - { label: "Titre", name: titre, widget: string }
              - { label: "Note du bas (appel aux anciens membres)", name: note, widget: text }

          - label: "Bureaux précédents (historique)"
            name: bureaux
            widget: list
            summary: "{{fields.periode}}"
            hint: "Mettez le bureau le plus récent en premier."
            fields:
              - { label: "Période (ex. 2024 – 2025)", name: periode, widget: string }
              - { label: "Nom d'équipe (optionnel)", name: nom, widget: string, required: false }
              - label: "Membres"
                name: membres
                widget: list
                summary: "{{fields.role}} — {{fields.nom}}"
                fields:
                  - { label: "Rôle (ex. Présidence)", name: role, widget: string }
                  - { label: "Nom", name: nom, widget: string }
                  - { label: "Photo (optionnelle)", name: photo, widget: image, required: false, hint: "Portrait carré de préférence — il s'affiche en rond." }
                  - { label: "Mini-bio (optionnelle)", name: description, widget: text, required: false, hint: "Ex. Étudiante en bachelier en droit, passionnée de théâtre." }
